<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Search Clips</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="{{ url_for('static', filename='taggerData.js') }}"></script>
    <script src="{{ url_for('static', filename='playerSuggest.js') }}"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const playerNames = JSON.parse(
          document.getElementById("player-data").textContent
        );

        enablePlayerSuggestions(
          document.querySelector('input[name="player"]'),
          playerNames
        );

        // Add click handlers for traits and badges after they are created
        // This will be done after populateTags() runs in taggerData.js

        document
          .querySelectorAll(".quality-group .toggle-button")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              const wasSelected = btn.classList.contains("selected");
              document
                .querySelectorAll(".quality-group .toggle-button")
                .forEach((b) => b.classList.remove("selected"));
              const hidden = document.querySelector('input[name="quality"]');
              if (wasSelected) {
                if (hidden) hidden.value = "";
              } else {
                btn.classList.add("selected");
                if (hidden) hidden.value = btn.dataset.value;
              }
            });
          });

        document
          .querySelectorAll(".distance-group .toggle-button")
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              const wasSelected = btn.classList.contains("selected");
              document
                .querySelectorAll(".distance-group .toggle-button")
                .forEach((b) => b.classList.remove("selected"));
              const hidden = document.querySelector('input[name="distance"]');
              if (wasSelected) {
                if (hidden) hidden.value = "";
              } else {
                btn.classList.add("selected");
                if (hidden) hidden.value = btn.dataset.value;
              }
            });
          });

        document.querySelectorAll(".filter-input").forEach((input) => {
          input.addEventListener("input", () => {
            const box = input.closest(".tag-box");
            const container = box.querySelector(".tag-list");
            const query = input.value.toLowerCase();
            const tags = container.querySelectorAll(".selectable");

            tags.forEach((tag) => {
              const text = tag.textContent.toLowerCase();
              tag.style.display = text.includes(query) ? "block" : "none";
            });
          });
        });
        const subSection = document.getElementById("subroles-section");
        if (subSection) {
          subSection.addEventListener("click", (e) => {
            const target = e.target.closest(".selectable");
            if (!target) return;
            toggleSelectLabel({ currentTarget: target });
          });

          const hidden = document.querySelector('input[name="subroles"]');
          if (hidden && hidden.value) {
            subSection.closest("details").setAttribute("open", "");
          }
        }
      });
    </script>
  </head>

  <body>
    <div class="container">
      <h1>Search Clips</h1>
      <form method="GET" action="/search">
        <div class="form-row">
          <input
            name="player"
            placeholder="Player"
            list="player-list"
            value="{{ args.get('player','') }}"
          />
          <datalist id="player-list">
            {% for p in players %}
            <option value="{{ p }}"></option>
            {% endfor %}
          </datalist>
          <div class="toggle-group quality-group">
            <div
              class="toggle-button {% if args.get('quality')=='Good' %}selected{% endif %}"
              data-value="Good"
            >
              Good
            </div>
            <div
              class="toggle-button {% if args.get('quality')=='Bad' %}selected{% endif %}"
              data-value="Bad"
            >
              Bad
            </div>
          </div>
          <input
            type="hidden"
            name="quality"
            value="{{ args.get('quality','') }}"
          />
        </div>

        <hr class="section-divider" />

        <!-- Game Information Section -->
        <div class="form-row game-info">
          <select name="opponent">
            <option value="">Opp</option>
            <option value="ARI" {% if args.get('opponent')=='ARI' %}selected{% endif %}>ARI</option>
            <option value="ATL" {% if args.get('opponent')=='ATL' %}selected{% endif %}>ATL</option>
            <option value="BAL" {% if args.get('opponent')=='BAL' %}selected{% endif %}>BAL</option>
            <option value="BUF" {% if args.get('opponent')=='BUF' %}selected{% endif %}>BUF</option>
            <option value="CAR" {% if args.get('opponent')=='CAR' %}selected{% endif %}>CAR</option>
            <option value="CHI" {% if args.get('opponent')=='CHI' %}selected{% endif %}>CHI</option>
            <option value="CIN" {% if args.get('opponent')=='CIN' %}selected{% endif %}>CIN</option>
            <option value="CLE" {% if args.get('opponent')=='CLE' %}selected{% endif %}>CLE</option>
            <option value="DAL" {% if args.get('opponent')=='DAL' %}selected{% endif %}>DAL</option>
            <option value="DEN" {% if args.get('opponent')=='DEN' %}selected{% endif %}>DEN</option>
            <option value="DET" {% if args.get('opponent')=='DET' %}selected{% endif %}>DET</option>
            <option value="GB" {% if args.get('opponent')=='GB' %}selected{% endif %}>GB</option>
            <option value="HOU" {% if args.get('opponent')=='HOU' %}selected{% endif %}>HOU</option>
            <option value="IND" {% if args.get('opponent')=='IND' %}selected{% endif %}>IND</option>
            <option value="JAX" {% if args.get('opponent')=='JAX' %}selected{% endif %}>JAX</option>
            <option value="KC" {% if args.get('opponent')=='KC' %}selected{% endif %}>KC</option>
            <option value="LV" {% if args.get('opponent')=='LV' %}selected{% endif %}>LV</option>
            <option value="LAC" {% if args.get('opponent')=='LAC' %}selected{% endif %}>LAC</option>
            <option value="LAR" {% if args.get('opponent')=='LAR' %}selected{% endif %}>LAR</option>
            <option value="MIA" {% if args.get('opponent')=='MIA' %}selected{% endif %}>MIA</option>
            <option value="MIN" {% if args.get('opponent')=='MIN' %}selected{% endif %}>MIN</option>
            <option value="NE" {% if args.get('opponent')=='NE' %}selected{% endif %}>NE</option>
            <option value="NO" {% if args.get('opponent')=='NO' %}selected{% endif %}>NO</option>
            <option value="NYG" {% if args.get('opponent')=='NYG' %}selected{% endif %}>NYG</option>
            <option value="NYJ" {% if args.get('opponent')=='NYJ' %}selected{% endif %}>NYJ</option>
            <option value="PHI" {% if args.get('opponent')=='PHI' %}selected{% endif %}>PHI</option>
            <option value="PIT" {% if args.get('opponent')=='PIT' %}selected{% endif %}>PIT</option>
            <option value="SF" {% if args.get('opponent')=='SF' %}selected{% endif %}>SF</option>
            <option value="SEA" {% if args.get('opponent')=='SEA' %}selected{% endif %}>SEA</option>
            <option value="TB" {% if args.get('opponent')=='TB' %}selected{% endif %}>TB</option>
            <option value="TEN" {% if args.get('opponent')=='TEN' %}selected{% endif %}>TEN</option>
            <option value="WAS" {% if args.get('opponent')=='WAS' %}selected{% endif %}>WAS</option>
          </select>
          <select name="home_away">
            <option value="">vs/@</option>
            <option value="vs" {% if args.get('home_away')=='vs' %}selected{% endif %}>vs</option>
            <option value="@" {% if args.get('home_away')=='@' %}selected{% endif %}>@</option>
          </select>
          <select name="quarter">
            <option value="">Qtr</option>
            <option value="1Q" {% if args.get('quarter')=='1Q' %}selected{% endif %}>1Q</option>
            <option value="2Q" {% if args.get('quarter')=='2Q' %}selected{% endif %}>2Q</option>
            <option value="3Q" {% if args.get('quarter')=='3Q' %}selected{% endif %}>3Q</option>
            <option value="4Q" {% if args.get('quarter')=='4Q' %}selected{% endif %}>4Q</option>
            <option value="OT" {% if args.get('quarter')=='OT' %}selected{% endif %}>OT</option>
          </select>
          <select name="down">
            <option value="">Dn</option>
            <option value="1st" {% if args.get('down')=='1st' %}selected{% endif %}>1st</option>
            <option value="2nd" {% if args.get('down')=='2nd' %}selected{% endif %}>2nd</option>
            <option value="3rd" {% if args.get('down')=='3rd' %}selected{% endif %}>3rd</option>
            <option value="4th" {% if args.get('down')=='4th' %}selected{% endif %}>4th</option>
          </select>
        </div>

        <hr class="section-divider" />

        <div class="form-row">
          <select name="playtype"></select>
          <select name="situation" aria-label="Pocket"></select>
        </div>
        <div class="form-row">
          <select name="outcome"></select>
          <select name="context"></select>
        </div>

        <!-- Year and Distance selectors -->
        <div class="form-row">
          <select name="year">
            <option value="">Any Year</option>
            <option value="2023" {% if args.get('year')=='2023' %}selected{% endif %}>2023</option>
            <option value="2024" {% if args.get('year')=='2024' %}selected{% endif %}>2024</option>
            <option value="2025" {% if args.get('year')=='2025' %}selected{% endif %}>2025</option>
          </select>
          <div class="toggle-group distance-group">
            <div
              class="toggle-button {% if args.get('distance')=='Short' %}selected{% endif %}"
              data-value="Short"
            >
              Short
            </div>
            <div
              class="toggle-button {% if args.get('distance')=='Medium' %}selected{% endif %}"
              data-value="Medium"
            >
              Medium
            </div>
            <div
              class="toggle-button {% if args.get('distance')=='Deep' %}selected{% endif %}"
              data-value="Deep"
            >
              Deep
            </div>
          </div>
          <input
            type="hidden"
            name="distance"
            value="{{ args.get('distance','') }}"
          />
        </div>

        <hr class="section-divider" />

        <div class="form-group">
          <label>Traits</label>
          <div class="chip-row" data-field="traits"></div>
          <input
            type="hidden"
            name="traits"
            value="{{ args.get('traits','') }}"
          />
        </div>

        <div id="roles-section" class="tag-section">
          <label>Role</label>
          <div class="column-block">
            <select class="role-select" name="role"></select>
          </div>
          <input
            type="hidden"
            name="roles"
            value="{{ args.get('roles','') }}"
          />
        </div>

        <details class="subrole-drawer">
          <summary>SubRoles</summary>
          <div id="subroles-section" class="tag-section">
            <div class="tag-box">
              <div class="box-header-row">
                <span class="box-title">SubRoles</span>
                <input
                  type="text"
                  class="filter-input"
                  placeholder="Search..."
                />
              </div>
              <div class="tag-list scrollable" data-filter-group></div>
            </div>
            <input
              type="hidden"
              name="subroles"
              value="{{ args.get('subroles','') }}"
            />
          </div>
        </details>

        <div class="form-group">
          <details class="badge-drawer">
            <summary>Badges</summary>
            <div class="chip-row" data-field="badges"></div>
          </details>
          <input
            type="hidden"
            name="badges"
            value="{{ args.get('badges','') }}"
          />
        </div>

        <button type="submit">🔍 Search</button>
      </form>

      {% if results %}
      <hr class="section-divider" />
      <button class="copy-btn" onclick="showListInFinder()">
        Show List in Finder
      </button>
      <ul class="results" id="results-list">
        {% for r in results %}
        <li data-path="{{ r.full_path }}">
          <a
            href="{{ url_for('serve_clip', year=r.year, player=r.player, filename=r.filename) }}"
            target="_blank"
          >
            {{ r.label }}
          </a>
          <button class="copy-btn" onclick="showInFinder('{{ r.full_path }}')">
            Show in Finder
          </button>
        </li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>

    <!-- Safely inject players JSON -->
    <script id="player-data" type="application/json">
      {{ players | tojson }}
    </script>

    <script src="/static/search.js"></script>
  </body>
</html>
